<!DOCTYPE html>
<html lang="en">

<head>
    <title>KulmiPay Popup Checkout Example</title>
    <meta name="viewport" content="width=device-width">
</head>

<body>
    <button onclick="openPopupCheckout()" data-host="http://kulmipay.com">
        Pay Now (Popup)
    </button>
    <script type="text/javascript" src="../build/kulmi-inline.js"></script>
    <script>

        function openPopupCheckout() {
                const kulmiObj = new globalThis.KulmiPay({
                    publicAPIKey: "ISPubKey_test_91ffc81a-8ac4-419e-8008-7091caa8d73f",
                    redirectURL: "http://kulmipay.com",
                    live: false
                })
                .on("COMPLETE", () => alert("COMPLETE"))
                .on("FAILED", () => alert("FAILED"))
                .on("IN-PROGRESS", () => console.log("INPROGRESS ..."))

                kulmiObj.run({
                    amount: 10,
                    currency: "KES",
                    email: "test@gmail.com",
                    method: "M-PESA",
                    first_name: "JOHN",
                    last_name: "DOE",
                    country: "KE",
                    mobile_tarrif: "CUSTOMER-PAYS",
                    bank_tarrif: "CUSTOMER-PAYS"
                })
        }
    </script>
</body>

</html>
